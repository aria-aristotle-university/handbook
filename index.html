<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARIA Handbook</title>
<meta name="description" content="Οδηγοί για τα μέλη της ARIA.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:dark;--bg:#151618;--surface:#1a1b1e;--line:#33353a;--hd:#e6e7e9;--tx:#c3c6cb;--dim:#9a9da3;--pw:#7b8ff5;
  --hd-font:'Commissioner',system-ui,-apple-system,'Segoe UI',sans-serif;--mo-font:'JetBrains Mono',Consolas,ui-monospace,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--hd-font);font-size:17px;line-height:1.6;padding:48px max(16px,env(safe-area-inset-left,0px)) 48px max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto;display:grid;gap:26px}
.k{font-family:var(--mo-font);font-size:12px;letter-spacing:.17em;text-transform:uppercase;color:var(--pw);margin:0}
h1{font-weight:300;font-size:clamp(32px,6vw,48px);line-height:1.1;color:var(--hd);margin:6px 0 10px}
p{margin:0}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
a.g{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;text-decoration:none;color:var(--tx);border:1px solid var(--line);background:var(--surface);padding:16px 18px}
a.g:hover,a.g:focus-visible{border-color:var(--pw);outline:none}
.n{font-family:var(--mo-font);font-size:13px;color:var(--pw)}
.t{display:block;color:var(--hd);font-size:18px}
.d{display:block;font-size:14.5px;color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="k">ARIA · Aristotle Robotics &amp; Innovation Association</p>
    <h1>Handbook</h1>
    <p>Οδηγοί για τα μέλη της ARIA.</p>
  </header>
  <ul>
    <li><a class="g" href="git/"><span class="n">01</span><span><span class="t">Git για την ARIA</span><span class="d">git και GitHub για όλα τα μέλη, βήμα βήμα</span></span></a></li>
  </ul>
</div>
</body>
</html>
